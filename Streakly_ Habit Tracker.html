<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streakly: Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#4f46e5}
@property --b{syntax:'<color>';inherits:true;initial-value:#7c3aed}
@property --c{syntax:'<color>';inherits:true;initial-value:#2563eb}
:root{--a:#4f46e5;--b:#7c3aed;--c:#2563eb;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:--a 1.4s ease,--b 1.4s ease,--c 1.4s ease}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f1eeff;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;background:#07050f;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 50% at 15% 0%,color-mix(in srgb,var(--a) 45%,transparent),transparent 70%),
  radial-gradient(55% 45% at 100% 20%,color-mix(in srgb,var(--b) 40%,transparent),transparent 70%),
  radial-gradient(60% 50% at 50% 110%,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%),#07050f}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid color-mix(in srgb,var(--c) 38%,rgba(255,255,255,.14));border-radius:24px;
  box-shadow:0 12px 44px -12px color-mix(in srgb,var(--a) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.14)}
.grad-text{background:linear-gradient(90deg,var(--c),var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent;filter:brightness(1.5)}
.field{width:100%;background:rgba(10,6,25,.55);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:.7rem .9rem;color:#fff;font:inherit;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:rgba(230,225,255,.38)}
.field:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;border-radius:14px;padding:.8rem 1.1rem;color:#fff;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 26px -6px color-mix(in srgb,var(--b) 80%,transparent);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:999px;padding:.45rem .9rem;font-weight:600;font-size:.88rem;cursor:pointer;color:#e8e3ff;white-space:nowrap;transition:all .2s}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--b) 70%,transparent)}
/* day pills */
.pill{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;aspect-ratio:1/1.25;border-radius:18px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#d9d3f5;font:inherit;font-weight:600;font-size:.78rem;transition:transform .15s,box-shadow .3s,background .3s}
.pill:hover{transform:translateY(-3px);border-color:var(--c)}
.pill.done{background:linear-gradient(160deg,var(--c),var(--a) 55%,var(--b));border-color:transparent;color:#fff;box-shadow:0 0 26px color-mix(in srgb,var(--b) 80%,transparent),0 0 6px color-mix(in srgb,var(--c) 90%,transparent)}
.pill.pulse{animation:pulse .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pulse{0%{transform:scale(.85)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.pill .tick{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26}
.pill.done .tick{stroke-dashoffset:0;transition:stroke-dashoffset .4s .05s ease-out}
.pill .face{font-size:1.4rem;line-height:1}.pill.done .face{display:none}.pill:not(.done) .tick{display:none}
/* ring + bar */
.ring-bg{stroke:rgba(255,255,255,.12)}
.ring-fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.4,1);filter:drop-shadow(0 0 8px var(--c))}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--b),var(--a));box-shadow:0 0 16px var(--b);transition:width .7s cubic-bezier(.3,1.2,.4,1)}
.streak-num{font-weight:800;font-size:3.6rem;line-height:1;text-shadow:0 0 22px var(--c),0 0 48px var(--b)}
.flame{color:#fbbf24;filter:drop-shadow(0 0 10px var(--a));animation:flick 1.8s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.12) rotate(-4deg)}}
/* reward */
.reward{border-radius:24px;padding:1.4rem;text-align:center;color:#2a1200;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#fde047,#fbbf24,#fb7185,#ec4899,#fde047);background-size:250% 100%;animation:shine 4s linear infinite;
  box-shadow:0 0 50px rgba(251,191,36,.55),0 0 90px rgba(236,72,153,.4)}
@keyframes shine{to{background-position:250% 0}}
.locked{border:1px dashed rgba(255,255,255,.22);border-radius:24px;padding:1.2rem;text-align:center;color:#cfc8ee;background:rgba(255,255,255,.03)}
.reward .btn{background:#2a1200;box-shadow:0 8px 22px -6px rgba(0,0,0,.5)}
/* pops */
#pops{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.pop{position:absolute;display:flex;align-items:center;gap:.6rem;max-width:min(300px,82vw);padding:.6rem .95rem .6rem .7rem;border-radius:18px;font-weight:600;font-size:.9rem;
  background:rgba(20,12,45,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 10px 30px -8px color-mix(in srgb,var(--b) 80%,transparent);animation:floaty 4.4s ease-in-out forwards}
.pop b{font-size:1.9rem;line-height:1;font-weight:400}
@keyframes floaty{0%{opacity:0;transform:translateY(24px) scale(.8) rotate(-3deg)}12%{opacity:1;transform:translateY(0) scale(1.04) rotate(1deg)}20%{transform:scale(1)}80%{opacity:1;transform:translateY(-26px)}100%{opacity:0;transform:translateY(-52px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.pop{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="bg"></div>
<div id="pops" aria-hidden="true"></div>

<main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:py-10">
  <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl"><span class="grad-text">Streakly</span></h1>
      <p class="mt-1 text-sm text-violet-200/70">Stack a habit. Bundle a treat. Become the person.</p>
    </div>
    <div id="levelBadge" class="glass flex items-center gap-2 !rounded-full px-4 py-2 text-sm font-semibold"></div>
  </header>

  <div class="grid gap-5 lg:grid-cols-[360px_1fr]">
    <!-- Habit stacking form -->
    <section class="glass h-fit p-5 sm:p-6" aria-labelledby="formTitle">
      <h2 id="formTitle" class="mb-4 flex items-center gap-2 text-lg font-bold"><i data-lucide="layers" class="h-5 w-5"></i> Stack a new habit</h2>
      <form id="habitForm" class="space-y-3.5" autocomplete="off">
        <label class="block text-sm font-semibold">Trigger
          <input class="field mt-1.5" name="trigger" required maxlength="80" placeholder="When I drink my morning coffee">
        </label>
        <label class="block text-sm font-semibold">New habit
          <input class="field mt-1.5" name="habit" required maxlength="80" placeholder="Eat an apple instead of chocolate">
        </label>
        <label class="block text-sm font-semibold">Temptation bundle
          <input class="field mt-1.5" name="bundle" maxlength="80" placeholder="Listen to my favorite track">
        </label>
        <label class="block text-sm font-semibold">Identity shift
          <input class="field mt-1.5" name="identity" maxlength="80" placeholder="I am a healthy person">
        </label>
        <button class="btn w-full" type="submit"><i data-lucide="plus" class="h-5 w-5"></i> Add habit</button>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dash" class="min-w-0 space-y-5" aria-live="polite"></section>
  </div>
</main>

<script>
(() => {
  'use strict';
  const KEY = 'streakly.v1';
  const LEVELS = [
    { name: 'Warming up',  a: '#4f46e5', b: '#7c3aed', c: '#2563eb', confetti: ['#6366f1', '#8b5cf6', '#60a5fa'] },
    { name: 'In the zone', a: '#a855f7', b: '#7c3aed', c: '#22d3ee', confetti: ['#22d3ee', '#a855f7', '#67e8f9'] },
    { name: 'Reward mode', a: '#fb7185', b: '#ec4899', c: '#fbbf24', confetti: ['#fbbf24', '#fde047', '#ec4899', '#fb7185'] }
  ];
  const MSG = {
    idle: [['👀', 'I’m watching you. Lovingly. Mostly.'], ['🐒', 'Monkey business detected on this dashboard.'], ['🍕', 'Pizza is thinking about you right now.'],
      ['💀', 'Your couch just called. You ignored it. Respect.'], ['👀', 'Hey, are you actually going to click that?'], ['🍫', 'Chocolate whispered something. I didn’t catch it.'],
      ['🦄', 'Rare habit-hero sighting!'], ['🧠', 'Future you says thanks in advance.'], ['🫡', 'Carry on, champion.']],
    cheer: [['🚀', 'Legend alert!'], ['🔥', 'Look at you being all consistent.'], ['🐐', 'GOAT behavior. No notes.'], ['👀', 'Bro, seriously? That was clean.'], ['😎', 'Smooth. Suspiciously smooth.']],
    undo: [['💀', 'Un-checking? Dramatic.'], ['🙈', 'I saw nothing. It never happened.'], ['🫠', 'It’s fine. We’re fine. Just never miss twice.']],
    add: [['🧱', 'New habit stacked. Bricklayer energy.'], ['🐒', 'Ooh, a fresh habit. Monkey approves.']],
    claim: [['🍕', 'Enjoy it. You earned every bite.'], ['🎉', 'Guilt-free. Legally binding.']]
  };

  const $ = (s) => document.querySelector(s);
  const dash = $('#dash');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- state ---------- */
  const newHabit = (o) => ({ id: uid(), days: Array(7).fill(false), claimed: false, ...o });
  const seed = () => {
    const h = newHabit({ trigger: 'I drink my morning coffee', habit: 'eat an apple instead of chocolate', bundle: 'listen to my favorite track', identity: 'I am a healthy person' });
    h.days[0] = true;
    return { habits: [h], sel: h.id };
  };
  let S = (() => { try { const r = localStorage.getItem(KEY); if (r) { const p = JSON.parse(r); if (p && p.habits) return p; } } catch (e) {} return seed(); })();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const cur = () => S.habits.find((h) => h.id === S.sel) || S.habits[0];

  /* ---------- helpers ---------- */
  const longestRun = (d) => { let m = 0, r = 0; d.forEach((x) => { r = x ? r + 1 : 0; m = Math.max(m, r); }); return m; };
  const levelOf = (s) => (s >= 6 ? 2 : s >= 3 ? 1 : 0);
  function grace(days) {
    const last = days.lastIndexOf(true);
    let single = false, dbl = false, run = 0;
    for (let i = 0; i <= last; i++) {
      if (!days[i]) run++; else { if (run === 1) single = true; if (run >= 2) dbl = true; run = 0; }
    }
    if (dbl) return 'Two in a row happens. No guilt: do the tiniest version today and you’re back on track.';
    if (single) return 'You skipped a day and that’s totally fine. Just don’t miss twice.';
    return 'Missing once is just life. Missing twice starts a new habit, so bounce back fast.';
  }
  function applyTheme() {
    const h = cur(), lv = LEVELS[h ? levelOf(longestRun(h.days)) : 0], r = document.documentElement.style;
    r.setProperty('--a', lv.a); r.setProperty('--b', lv.b); r.setProperty('--c', lv.c);
    return lv;
  }

  /* ---------- render ---------- */
  function render(popIdx = -1) {
    const lv = applyTheme(), h = cur();
    $('#levelBadge').innerHTML = `<i data-lucide="zap" class="h-4 w-4"></i> Level ${LEVELS.indexOf(lv) + 1}: ${lv.name}`;
    if (!h) {
      dash.innerHTML = `<div class="glass p-8 text-center"><div class="mb-2 text-5xl">🌱</div><h2 class="text-xl font-bold">No habits yet</h2><p class="mt-1 text-violet-200/70">Fill in the form to stack your first habit.</p></div>`;
      return lucide.createIcons();
    }
    const done = h.days.filter(Boolean).length, shown = Math.min(done, 6), streak = longestRun(h.days);
    const C = 2 * Math.PI * 46, off = C * (1 - shown / 6), unlocked = done >= 6;
    const chips = S.habits.map((x) => `<button class="chip ${x.id === h.id ? 'on' : ''}" data-act="sel" data-id="${x.id}">${esc(x.habit.length > 26 ? x.habit.slice(0, 25) + '…' : x.habit)}</button>`).join('');
    const pills = h.days.map((on, i) => `
      <button class="pill ${on ? 'done' : ''} ${i === popIdx ? 'pulse' : ''}" data-act="day" data-i="${i}" aria-pressed="${on}" aria-label="Day ${i + 1}${i === 6 ? ' (reward day)' : ''}">
        <span class="face">${i === 6 ? '🎁' : '○'}</span>
        <svg class="tick" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        <span>Day ${i + 1}</span>
      </button>`).join('');
    const bundle = h.bundle ? `, and then <em class="text-cyan-200 not-italic font-semibold">${esc(h.bundle)}</em>` : '';
    const ident = h.identity ? `Because <strong class="grad-text">${esc(h.identity)}</strong>.` : '';

    dash.innerHTML = `
      <div class="flex gap-2 overflow-x-auto pb-1">${chips}</div>

      <div class="glass p-5 sm:p-6">
        <div class="flex items-start justify-between gap-3">
          <p class="text-base leading-relaxed sm:text-lg">When <strong>${esc(h.trigger)}</strong>, I will <strong>${esc(h.habit)}</strong>${bundle}. ${ident}</p>
          <button class="chip !p-2" data-act="del" aria-label="Delete habit" title="Delete habit"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
        </div>

        <div class="mt-6 flex flex-wrap items-center gap-6">
          <div class="flex items-center gap-4">
            <i data-lucide="flame" class="flame h-12 w-12"></i>
            <div><div class="streak-num">${streak}</div><div class="text-sm text-violet-200/70">day streak</div></div>
          </div>
          <div class="relative ml-auto h-28 w-28 shrink-0" role="img" aria-label="${shown} of 6 healthy days">
            <svg viewBox="0 0 110 110" class="h-full w-full -rotate-90">
              <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--c)"/><stop offset="1" stop-color="var(--a)"/></linearGradient></defs>
              <circle class="ring-bg" cx="55" cy="55" r="46" fill="none" stroke-width="10"/>
              <circle class="ring-fg" cx="55" cy="55" r="46" fill="none" stroke-width="10" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-2xl font-extrabold">${shown}/6</span><span class="text-xs text-violet-200/70">healthy</span></div>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-7 gap-1.5 sm:gap-3">${pills}</div>
        <div class="mt-5">
          <div class="mb-1.5 flex justify-between text-sm font-semibold"><span>Progress to reward</span><span>${shown} of 6 days</span></div>
          <div class="bar"><i style="width:${(shown / 6) * 100}%"></i></div>
        </div>
        <div class="mt-4 text-right"><button class="chip" data-act="reset"><i data-lucide="rotate-ccw" class="mr-1 inline h-3.5 w-3.5"></i>Start a new week</button></div>
      </div>

      ${unlocked ? `
        <div class="reward">
          <div class="text-4xl">${h.claimed ? '✅' : '🎁'}</div>
          <h3 class="mt-1 text-2xl font-extrabold">${h.claimed ? 'Reward claimed. Enjoy it!' : '🎉 Cheat Meal / Reward Unlocked!'}</h3>
          <p class="mt-1 font-medium">${h.claimed ? 'Guilt-free, fully earned. A new week starts whenever you’re ready.' : 'Six healthy days done. Pick your treat and savor it.'}</p>
          ${h.claimed ? '' : '<button class="btn mt-4" data-act="claim"><i data-lucide="gift" class="h-5 w-5"></i> Claim my reward</button>'}
        </div>` : `
        <div class="locked"><div class="text-3xl">🔒</div><p class="mt-1 font-semibold">Reward locked</p>
          <p class="text-sm">${6 - done} more healthy ${6 - done === 1 ? 'day' : 'days'} to unlock your cheat meal.</p></div>`}

      <div class="glass flex items-start gap-3 p-4 sm:p-5">
        <div class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl text-xl" style="background:linear-gradient(135deg,var(--a),var(--b))">💜</div>
        <div><span class="inline-block rounded-full px-3 py-0.5 text-sm font-bold" style="background:linear-gradient(90deg,var(--c),var(--b));color:#fff">Never miss twice</span>
          <p class="mt-1.5 text-sm leading-relaxed text-violet-100/85">${grace(h.days)}</p></div>
      </div>`;
    lucide.createIcons();
  }

  /* ---------- confetti ---------- */
  function boom(el, big) {
    const colors = LEVELS[levelOf(longestRun((cur() || { days: [] }).days))].confetti;
    const o = { colors, disableForReducedMotion: true };
    if (big) {
      const end = Date.now() + 1400;
      (function f() {
        confetti({ ...o, particleCount: 6, angle: 60, spread: 70, origin: { x: 0, y: .75 } });
        confetti({ ...o, particleCount: 6, angle: 120, spread: 70, origin: { x: 1, y: .75 } });
        if (Date.now() < end) requestAnimationFrame(f);
      })();
      confetti({ ...o, particleCount: 160, spread: 110, startVelocity: 45, origin: { y: .6 }, colors: ['#fde047', '#fbbf24', '#ec4899', '#fb7185', '#fff'] });
    } else {
      const r = el ? el.getBoundingClientRect() : null;
      confetti({ ...o, particleCount: 45, spread: 65, startVelocity: 28, scalar: .9,
        origin: r ? { x: (r.left + r.width / 2) / innerWidth, y: (r.top + r.height / 2) / innerHeight } : { y: .6 } });
    }
  }

  /* ---------- emoji pop-ups ---------- */
  let lastPop = 0;
  function pop(kind = 'idle') {
    const box = $('#pops');
    if (box.children.length >= 3) return;
    const pool = MSG[kind], [emoji, text] = pool[Math.floor(Math.random() * pool.length)];
    const el = document.createElement('div');
    el.className = 'pop';
    el.style.left = (4 + Math.random() * 58) + '%';
    el.style.top = (18 + Math.random() * 62) + '%';
    el.innerHTML = `<b>${emoji}</b><span>${text}</span>`;
    el.addEventListener('animationend', () => el.remove());
    if (reduce) setTimeout(() => el.remove(), 3500);
    box.appendChild(el);
    lastPop = Date.now();
  }
  (function loop() { setTimeout(() => { if (!document.hidden) pop('idle'); loop(); }, 6000 + Math.random() * 6000); })();
  document.addEventListener('pointerdown', () => { if (Date.now() - lastPop > 4000 && Math.random() < .22) pop('idle'); });

  /* ---------- actions ---------- */
  dash.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const h = cur(), act = t.dataset.act;
    if (act === 'sel') { S.sel = t.dataset.id; save(); render(); }
    if (act === 'day') {
      const i = +t.dataset.i, wasDone = h.days[i], before = h.days.filter(Boolean).length;
      h.days[i] = !wasDone; save(); render(i);
      const el = dash.querySelector(`.pill[data-i="${i}"]`);
      if (!wasDone) {
        boom(el, false);
        if (before < 6 && h.days.filter(Boolean).length >= 6) { setTimeout(() => boom(null, true), 350); pop('claim'); }
        else if (Math.random() < .6) pop('cheer');
      } else if (Math.random() < .7) pop('undo');
    }
    if (act === 'claim') { h.claimed = true; save(); render(); boom(null, true); pop('claim'); }
    if (act === 'reset') { h.days = Array(7).fill(false); h.claimed = false; save(); render(); }
    if (act === 'del') {
      S.habits = S.habits.filter((x) => x.id !== h.id); S.sel = S.habits[0] ? S.habits[0].id : null; save(); render();
    }
  });

  $('#habitForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(e.target), v = (k) => String(f.get(k) || '').trim();
    if (!v('trigger') || !v('habit')) return;
    const h = newHabit({ trigger: v('trigger'), habit: v('habit'), bundle: v('bundle'), identity: v('identity') });
    S.habits.push(h); S.sel = h.id; save(); e.target.reset(); render(); boom(null, false); pop('add');
    dash.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  });

  render();
  setTimeout(() => pop('idle'), 2500);
})();
</script>
</body>
</html>
